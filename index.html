<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerador de Sense FF - Key Expira</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background: #0e0e0e;
    color: #fff;
    text-align: center;
    padding: 20px;
}

.box {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 10px;
    max-width: 420px;
    margin: auto;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
    font-size: 16px;
}

button {
    background: #00ff88;
    font-weight: bold;
    cursor: pointer;
}

.result {
    background: #000;
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="box">
    <h2>🔐 Gerador de Sense FF</h2>

    <input type="text" id="keyInput" placeholder="Digite sua KEY">
    <button onclick="verificarKey()">Verificar Key</button>

    <div id="gerador" style="display:none;">
        <button onclick="gerarSense()">🎯 Gerar Sense</button>
        <div class="result" id="resultado"></div>
    </div>
</div>

<script>
// ===================================
// 🔑 KEYS COM DATA DE EXPIRAÇÃO
// ===================================
const keys = [
    { key: "Miguel1", expira: "2025-12-31" },
    { key: "Miguel2", expira: "2025-12-30" },
    { key: "Miguel3", expira: "2025-12-18" }
];

// ===================================
// 🔐 VERIFICAR KEY + EXPIRAÇÃO
// ===================================
function verificarKey() {
    const keyDigitada = document.getElementById("keyInput").value;
    const hoje = new Date();

    const keyValida = keys.find(k => k.key === keyDigitada);

    if (!keyValida) {
        alert("❌ Key inválida!");
        return;
    }

    const dataExpira = new Date(keyValida.expira);

    if (hoje > dataExpira) {
        alert("⏳ Key expirada!");
        return;
    }

    alert("✅ Key válida! Acesso liberado.");
    document.getElementById("gerador").style.display = "block";
}

// ===================================
// 🎯 GERADOR DE SENSE
// ===================================
function gerarSense() {
    const r = () => Math.floor(Math.random() * 200) + 1;

    document.getElementById("resultado").innerHTML = `
        <b>🎯 Sense Gerada</b><br><br>
        Geral: ${r()}<br>
        Red Dot: ${r()}<br>
        2x: ${r()}<br>
        4x: ${r()}<br>
        AWM: ${r()}
    `;
}
</script>

</body>
</html>
